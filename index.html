<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GrandBrandView</title>
    <!-- Tema antes de pintar (evita parpadeo). Guardado en localStorage "gbv-tema"; si no hay, sigue al sistema. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('gbv-tema');
          var t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
